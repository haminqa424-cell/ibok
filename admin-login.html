<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box {
            background: #fff; border-radius: 16px; padding: 40px 35px; width: 90%; max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .login-box h1 { font-size: 22px; color: #1a1a1a; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 15px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #1565c0; }
        .login-btn {
            width: 100%; padding: 13px; background: #1565c0; color: #fff; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .login-btn:hover { background: #0d47a1; }
        .error-msg { color: #c62828; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>لوحة التحكم</h1>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="login-btn" onclick="doLogin()">دخول</button>
        <p class="error-msg" id="errorMsg">كلمة المرور غير صحيحة</p>
    </div>
    <script>
        async function doLogin() {
            const pw = document.getElementById('password').value;
            if (!pw) return;
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw })
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = '/admin-panel';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
